[project]
name = "english-coach-mcp"
version = "0.1.0"
description = "MCP server / Agent Skill for Alexa+: conversational English pronunciation coach"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "mcp[cli]>=2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/english_coach_mcp"]
